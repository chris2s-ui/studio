<!DOCTYPE html>
<html>
<head>
    <title>Storia</title>
    <style>
        body {
            background-color: #ffc107;
            margin: 0;
            font-family: sans-serif;
        }
        .argomenti {
            width: 90%;
            margin: 40px auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        .argomenti-box {
            background: #eae7e7;
            border: 2px solid #df7878;
            border-radius: 15px;
            padding: 30px 10px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .argomenti-box:hover {
            background: #df7878;
            color: white;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1 style="text-align:center; font-size:50px; color: white;">matematica</h1>

    <div class="argomenti">
        <div class="argomenti-box" onclick="location.href='seconda guerra mondiale.html'">seconda guerra mondiale</div>
        <div class="argomenti-box" onclick="location.href='rivoluzione francese.html'">rivoluzione francese</div>
        <div class="argomenti-box" onclick="location.href='unificazione italiana.html'">unificazione italiana</div>
    </div>

</body>
</html>
