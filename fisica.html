<!DOCTYPE html>
<html>
<head>
    <title>Fisica</title>
    <style>
        body {
            background-color: #e8f5e9; /* Sfondo verde chiaro */
            margin: 0;
            font-family: sans-serif;
        }

        h1 {
            text-align: center; 
            font-size: 50px;
            color: #2e7d32; /* Verde scuro per il titolo */
            margin-top: 30px;
        }

        .argomenti {
            width: 90%;
            margin: 40px auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .argomenti-box {
            background: #ffffff;
            border: 2px solid #4caf50; /* Bordo verde */
            border-radius: 15px;
            padding: 30px 10px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #2e7d32;
            cursor: pointer;
            transition: 0.3s;
        }

        .argomenti-box:hover {
            background: #4caf50; /* Verde al passaggio del mouse */
            color: white;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1>Fisica</h1>

    <div class="argomenti">
        <div class="argomenti-box" onclick="location.href='kirchhoff.html'">Kirchhoff</div>
        <div class="argomenti-box" onclick="location.href='termodinamica.html'">Termodinamica</div>
        <div class="argomenti-box" onclick="location.href='elettromagnetismo.html'">Elettromagnetismo</div>
    </div>

</body>
</html>
