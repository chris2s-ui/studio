<h1 style="text-align:center; font-size:50px;">equazioni</h1>

<div class="contenuto">
    <p>Un’equazione è un’uguaglianza che contiene una o più incognite</p>
    <p>Per risolverla bisogna trovare il valore dell’incognita che rende vera l’uguaglianza</p>
    <p>Esempio:</p>
    <p><b>2x+4=10</b></p>
    <p>2x=6</p>
    <p>x=3</p>
</div>
