<h1 style="text-align:center; font-size:50px;">logaritmi</h1>

<div class="contenuto">
    <p>Un logaritmo è l’esponente a cui bisogna elevare la base per ottenere un certo numero</p>
    <p>Per calcolarlo bisogna risolvere un’equazione esponenziale</p>
    <p>Esempio:</p>
    <p><b>log₂(8)=3</b></p>
    <p>2³=8</p>
