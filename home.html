<!DOCTYPE html>
<html>
    <head>
        <title> home </title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600;1,800&display=swap" rel="stylesheet">

        <style>
            body {
                background-image: url('https://media.istockphoto.com/id/1949882446/it/vettoriale/verde-acqua-arancione-sfondo-granuloso-striscione-rumore-struttura-incandescente.jpg?s=612x612&w=0&k=20&c=d2lOOkSQIykXCp58ivSAO5DtWCEqNKqmKOqr7Egg51w=');
                background-size: cover;
                background-position: center;
                background-attachment: fixed;
                background-repeat: no-repeat;
                margin: 0;
                min-height: 100vh;
                font-family: Arial, sans-serif;
            }

            .titolo-principale {
                text-align: center;
                font-size: 60px;
                margin-top: 40px;
                color: #111;
                font-family: 'Playfair Display', serif;
                font-style: italic;                      
                text-transform: uppercase;              
                letter-spacing: 2px;                     
            }

            .materie {
                width: 90%;
                margin: 40px auto;
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 20px;
            }

            
            .materie-box {
                background: rgba(255, 255, 255, 0.85);
                backdrop-filter: blur(8px);
                border: none;                            
                border-radius: 15px;
                padding: 30px 10px;
                text-align: center;
                font-size: 20px;
                font-weight: bold;
                cursor: pointer;
                transition: all 0.3s ease;               
                box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15); 
            }

            
            .materie-box:hover {
                background: #ffffff;
                color: #df7878;
                transform: translateY(-5px);           
                box-shadow: 0 12px 25px rgba(0, 0, 0, 0.25); 
            }
        </style>
    </head>
    <body>
        <h1 class="titolo-principale">MY_SPACE_STUDIO</h1>
        <p style="text-align: center; font-size: 20px; margin-top: 50px; color: #222;">scegli la materia e trova tutto ciò di cui hai bisogno!</p>
        
        <div class="materie">
            <div class="materie-box" onclick="location.href='matematica.html'">📐 matematica</div>
            <div class="materie-box" onclick="location.href='letteratura.html'">📚 letteratura</div>
            <div class="materie-box" onclick="location.href='scienze.html'">🔬 scienze</div>
            <div class="materie-box" onclick="location.href='storia.html'">📜 storia</div>
            <div class="materie-box" onclick="location.href='inglese.html'"> inglese</div>
            <div class="materie-box" onclick="location.href='informatica.html'">💻 informatica</div>
            <div class="materie-box" onclick="location.href='geografica.html'">🌍 geografia</div>
            <div class="materie-box" onclick="location.href='fisica.html'">⚡ fisica</div>
        </div>
    </body>
</html>
