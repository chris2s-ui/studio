<!DOCTYPE html>
<html>
    <head>
        <title> home </title>
        <style>
            body {
                /* Sfondo caricato direttamente dal link di iStock */
                background-image: url('https://media.istockphoto.com/id/1949882446/it/vettoriale/verde-acqua-arancione-sfondo-granuloso-striscione-rumore-struttura-incandescente.jpg?s=612x612&w=0&k=20&c=d2lOOkSQIykXCp58ivSAO5DtWCEqNKqmKOqr7Egg51w=');
                background-size: cover;
                background-position: center;
                background-attachment: fixed;
                background-repeat: no-repeat;
                margin: 0;
                min-height: 100vh;
                font-family: Arial, sans-serif;
            }

            .materie {
                width: 90%;
                margin: 40px auto;
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 20px;
            }

            .materie-box {
                /* Sfondo leggermente trasparente e sfocato per fare risaltare il testo */
                background: rgba(234, 231, 231, 0.85);
                backdrop-filter: blur(8px);
                border: 2px solid #df7878;
                border-radius: 15px;
                padding: 30px 10px;
                text-align: center;
                font-size: 20px;
                font-weight: bold;
                cursor: pointer;
                transition: 0.3s;
            }

            .materie-box:hover {
                background: #df7878;
                color: white;
                transform: scale(1.05);
            }
        </style>
    </head>
    <body>
        <h1 style="text-align: center; font-size: 60px; margin-top: 40px; color: #111;">MY_SPACE_STUDIO</h1>
        <p style="text-align: center; font-size: 20px; margin-top: 30px; color: #222;">scegli la materia e trova tutto ciò di cui hai bisogno!</p>
        
        <div class="materie">
            <div class="materie-box" onclick="location.href='matematica.html'">matematica</div>
            <div class="materie-box" onclick="location.href='letteratura.html'">letteratura</div>
            <div class="materie-box" onclick="location.href='scienze.html'">scienze</div>
            <div class="materie-box" onclick="location.href='storia.html'">storia</div>
            <div class="materie-box" onclick="location.href='inglese.html'">inglese</div>
            <div class="materie-box" onclick="location.href='informatica.html'">informatica</div>
            <div class="materie-box" onclick="location.href='geografia.html'">geografia</div>
            <div class="materie-box" onclick="location.href='fisica.html'">fisica</div>
        </div>
    </body>
</html>
